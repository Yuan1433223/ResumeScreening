# frontend nginx 站点配置
# 对齐 frontend/vite.config.ts 的 dev proxy：
#   vite: '/api' -> http://127.0.0.1:8017, changeOrigin, 不做路径重写
#   即浏览器请求 /api/health -> 后端收到 /api/health
# 因此这里 proxy_pass 后面**不带 URI（尾斜杠/路径）**，nginx 会原样保留 /api/... 转发。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip（可选，减小 HTML/JS 传输）
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 反向代理后端 API：保留 /api 前缀，与 vite dev 行为一致。
    # 注意：proxy_pass 末尾不要加 /，否则会把 /api/health 改写成 /health，
    # 而后端路由是 @app.get("/api/health")，会 404。
    location /api/ {
        proxy_pass         http://backend:8017;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 模型抽取单份可能耗时 60~80s，放宽超时
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA history/hash 路由回退：未命中静态文件时交回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
